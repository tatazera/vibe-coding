; Configuracao do Naruto Helper. Salve e recarregue o script (Ctrl+Alt+R nao existe: feche e abra de novo).

[geral]
; Nome do executavel do jogo
janela_exe=Warcraft III.exe
; Tecla que seleciona o heroi no jogo
tecla_selecionar_heroi=F1
; Liga/desliga o helper (^ = Ctrl, ! = Alt)
tecla_liga_desliga=^!h
; Mostra um aviso rapido na tela ao ligar/desligar
mostrar_aviso=1

[tempo]
; Espera depois da tecla da skill antes de mandar F1 (aumente se a selecao ainda se perder)
atraso_apos_skill_ms=60
; Para skills com alvo: quanto tempo vale o proximo clique esquerdo
janela_do_clique_ms=2500
; Evita dois F1 seguidos (que centralizam a camera)
intervalo_minimo_entre_f1_ms=300

[teclas]
; Skills que NAO pedem alvo: F1 logo apos apertar a tecla
skills_instantaneas=q,w,e,r,t,d,x
; Skills que pedem alvo/ponto: F1 so depois do clique que lanca a skill.
; Mova a tecla da lista de cima para esta se F1 cancelar o cursor de mira.
skills_com_alvo=
